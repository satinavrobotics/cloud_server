# Alembic config for the Phase 0 schema (docs/satinav-fleet-agent-phase0-v2.md §3, WP1.5-1.7).
#
# Rules (enforced by migrations/env.py and tests/unit/test_alembic_migrations.py):
#   - raw-SQL migrations only (op.execute); autogenerate is DISABLED;
#   - the *objectv1 tables are NOT managed here: packages/database/postgres.py::initialize_database
#     still creates them at runtime (the include_object filter in env.py excludes them);
#   - revision ids are date-prefixed and passed explicitly:
#       alembic -c packages/api/alembic.ini revision -m "short name" --rev-id 20261001_01_short_name
#     (YYYYMMDD_NN_name, at most 32 chars: the alembic_version column is varchar(32)).
#
# The connection comes from packages/config.py (POSTGRES_DATABASE_*), not from this file.
# In production the API entrypoint (packages/api/entrypoint.py) runs `upgrade head` under an
# advisory lock before starting uvicorn.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
