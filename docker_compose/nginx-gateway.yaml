# Cloud gateway: the single front door in front of the cloud services (API :8000, agent :8007, LiveKit token
# service :8008) and the Expo dev server (:8081). Routing is shared with the robot gateway: nginx/routes.conf.
#
#   docker compose -f docker_compose/nginx-gateway.yaml up -d        (scripts/start-nginx.sh wraps this)
#
# Config: nginx/nginx-http.conf (HTTP only). For HTTPS mount nginx/nginx.conf instead and the Let's Encrypt
# certificates (below). Reload without downtime after editing:  docker exec sati_nginx_gateway nginx -s reload
services:
  nginx-gateway:
    image: nginx:alpine
    container_name: sati_nginx_gateway
    network_mode: "host"
    environment:
      # The read-only API door (nginx/readonly-cloud.conf.template) listens on this address, port 8090. MINIO_TAILNET_IP
      # is the cloud's tailnet address (profiles/server.env); unset, the door is on loopback only.
      - CLOUD_TAILNET_IP=${MINIO_TAILNET_IP:-127.0.0.1}
    volumes:
      - ./nginx/nginx-http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/readonly-cloud.conf.template:/etc/nginx/templates/readonly.conf.template:ro
      - ./nginx:/etc/nginx/sati:ro      # routes.conf, web-routes.conf (cloud) and the CORS files are included from here
      - ./downloads:/srv/sati-downloads:ro   # the desktop app's installers and latest.json (nginx/downloads.conf)
      # HTTPS: swap the first line for ./nginx/nginx.conf and uncomment
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  nginx_logs:
