services:
  # Create an MQTT broker
  mosquitto: 
    image: eclipse-mosquitto:latest
    command: 
      - /bin/sh
      - -c 
      - | 
        sh mosquitto.sh "${MQTT_PORT_TCP}" "${MQTT_PORT_WEBSOCKET}" 
    network_mode: "host"
    restart: unless-stopped
    volumes:
    - type: bind
      source: ../packages/utils/mosquitto.sh
      target: /mosquitto.sh

  # Create Postgres database
  postgres:
    image: timescale/timescaledb-ha:pg17.11-ts2.30.1
    # v2 WP1.2 settings. Do NOT override shared_preload_libraries here: the image already
    # ships 'timescaledb,pg_textsearch', and a -c override replaces the whole list.
    command: ["postgres",
              "-c", "timescaledb.telemetry_level=off",
              "-c", "timezone=UTC"]
    environment:
      - POSTGRES_USER=${POSTGRES_DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_DATABASE_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE_NAME}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
      # timescaledb-tune runs once, at initdb, and sizes from the container's cgroup limits.
      # There are none here, so without these it would size from the whole shared host.
      - TS_TUNE_MEMORY=4GB
      - TS_TUNE_NUM_CPUS=2
      - TS_TUNE_MAX_CONNS=100
      - TIMESCALEDB_TELEMETRY=off
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - pgdata17:/home/postgres/pgdata      # PGDATA is /home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DATABASE_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s



  # Create an instance of mission dispatch
  mission-dispatch:
    build:
      context: ..
      dockerfile: packages/controllers/mission/Dockerfile
    image: ${MISSION_DISPATCH_IMAGE:-mission_dispatch:latest}
    # NOTE: packages/controllers/mission/main.py's argparse defines the postgres flags with
    # HYPHENS (--postgres-host, --postgres-port, ...) while the mqtt flags use underscores.
    # parse_known_args() silently drops unrecognized flags, so underscored postgres_* flags
    # here would be (and, before this comment, always were) no-ops -- see AUDIT_BACKLOG.md.
    command: ["--mqtt_host", "${MQTT_HOST:-localhost}",
              "--mqtt_port", "${MQTT_PORT_WEBSOCKET}",
              "--mqtt_transport", "${MQTT_TRANSPORT}",
              "--postgres-host", "${POSTGRES_HOST:-localhost}",
              "--postgres-port", "${POSTGRES_DATABASE_PORT}",
              "--postgres-db", "${POSTGRES_DATABASE_NAME}",
              "--postgres-user", "${POSTGRES_DATABASE_USERNAME}",
              "--postgres-password", "${POSTGRES_DATABASE_PASSWORD}"]
    # What the dispatcher decides in advance for each node of an order (offline missions;
    # packages/controllers/mission/order_policy.py). Unset keys take the module's defaults.
    environment:
      - ROUTE_DEVIATION_XY_PASS_M=${ROUTE_DEVIATION_XY_PASS_M:-0.35}
      - ROUTE_DEVIATION_XY_FINAL_M=${ROUTE_DEVIATION_XY_FINAL_M:-0.1}
      - ROUTE_START_DEVIATION_XY_M=${ROUTE_START_DEVIATION_XY_M:-0.35}
      - ROUTE_DEVIATION_THETA_PASS_RAD=${ROUTE_DEVIATION_THETA_PASS_RAD:-3.1416}
      - ROUTE_DEVIATION_THETA_FINAL_RAD=${ROUTE_DEVIATION_THETA_FINAL_RAD:-0.785}
      - ROUTE_DEVIATION_ZERO_IS_UNSET=${ROUTE_DEVIATION_ZERO_IS_UNSET:-true}
      - ROUTE_DEVIATION_XY_LEGACY_DEFAULT_M=${ROUTE_DEVIATION_XY_LEGACY_DEFAULT_M:-0.1}

      - VDA5050_NODE_POLICY_MODE=${VDA5050_NODE_POLICY_MODE:-factsheet}
      - NODE_POLICY_MAX_WAIT_S=${NODE_POLICY_MAX_WAIT_S:-10}
      - MISSION_TIMEOUT_PAUSE_OFFLINE=${MISSION_TIMEOUT_PAUSE_OFFLINE:-true}
      - BLOCKED_NODE_EXCLUSION_MIN=${BLOCKED_NODE_EXCLUSION_MIN:-10}
      - ORDER_CANCEL_MIN_DWELL_S=${ORDER_CANCEL_MIN_DWELL_S:-2}
      # Fleet events spilled during a database outage survive a container recreate. A
      # directory of its own: the heartbeat (/tmp/mission_dispatch) must not outlive the container.
      - FLEET_SPILL_PATH=/var/lib/mission_dispatch/spill/fleet_events_spill.jsonl
    volumes:
      - mission_dispatch_spill:/var/lib/mission_dispatch/spill
    network_mode: "host"
    restart: unless-stopped
    # Python is PID 1 and handles SIGTERM itself (packages/controllers/mission/lifecycle.py,
    # RobotServer.graceful_shutdown, bounded at 8 s), so the default 10 s would do; 15 s
    # leaves slack. `init: true` adds tini as PID 1 to reap zombies (the dispatcher spawns
    # none today, so it is cheap insurance) and forwards signals to Python.
    stop_grace_period: 20s
    init: true
    # Liveness: the dispatcher touches this file every 5 s only while a SELECT 1 and the MQTT
    # connection are healthy. Plain docker compose does NOT restart an unhealthy container;
    # the status is visible in `docker ps` / scripts/check_health.sh (docs: packages/controllers/mission/README.md).
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime(os.getenv('MISSION_DISPATCH_HEARTBEAT_FILE','/tmp/mission_dispatch/heartbeat'))<60 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy

  # Create ArangoDB for topological map
  arangodb:
    image: arangodb/arangodb:latest
    environment:
      - ARANGO_ROOT_PASSWORD=${ARANGO_ROOT_PASSWORD:-openSesame}
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - arango_data:/var/lib/arangodb3

  # Create MinIO for image storage
  minio:
    image: minio/minio:latest
    # Loopback only; minio-tailnet (below) adds the Tailscale address. Never the LAN/internet.
    command: server /data --address "127.0.0.1:9000" --console-address "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - /media/satiadmin/data0/minio_data:/data

  # Forwards ${MINIO_TAILNET_IP}:9000 (and the console port) to MinIO on 127.0.0.1, so robots
  # and clients on the tailnet keep using presigned URLs on the Tailscale IP. Without
  # MINIO_TAILNET_IP only this container fails; it retries until tailscale0 has the address.
  minio-tailnet:
    image: nginx:alpine
    environment:
      - MINIO_TAILNET_IP=${MINIO_TAILNET_IP:-}
      - MINIO_CONSOLE_PORT=${MINIO_CONSOLE_PORT:-9001}
    command: ["sh", "-c", ": \"$${MINIO_TAILNET_IP:?set MINIO_TAILNET_IP}\" && envsubst '$${MINIO_TAILNET_IP} $${MINIO_CONSOLE_PORT}' < /minio_tailnet.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - ./minio_tailnet.nginx.conf.template:/minio_tailnet.conf.template:ro

  # Create Graph Builder Service
  graph-builder-service:
    build:
      context: ..
      dockerfile: packages/services/graph_builder/Dockerfile
    image: ${GRAPH_BUILDER_SERVICE_IMAGE:-graph_builder_service:latest}
    command: ["python", "-m", "packages.services.graph_builder.main",
              "--port", "${GRAPH_BUILDER_PORT:-8004}",
              "--host", "0.0.0.0"]
    environment:
      - MQTT_HOST=localhost
      - MQTT_PORT=${MQTT_PORT_TCP:-1883}
      - MQTT_TOPIC=${GRAPH_BUILDER_MQTT_TOPIC:-robot/node_update}
      - MQTT_IMAGE_TOPIC=${GRAPH_BUILDER_MQTT_IMAGE_TOPIC:-robot/image_upload}
      - ARANGO_HOST=localhost
      - ARANGO_PORT=${ARANGO_PORT:-8529}
      - ARANGO_USERNAME=root
      - ARANGO_PASSWORD=${ARANGO_ROOT_PASSWORD:-openSesame}
      - DATABASE_NAME=${GRAPH_DB_NAME:-topomap_db}
      - MINIO_HOST=localhost
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MINIO_SECURE=false
      - DISTANCE_THRESHOLD=${SIMILARITY_DISTANCE_THRESHOLD:-5.0}
      - MISSION_DISPATCH_URL=http://localhost:${API_DELEGATION_PORT:-8000}
      - RADIUS_THRESHOLD=${GRAPH_BUILDER_RADIUS_THRESHOLD:-2.0}
      - DEFAULT_MAP_ID=${IMAGE_DB_DEFAULT_MAP:-default}
    network_mode: "host"
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
      arangodb:
        condition: service_started
      minio:
        condition: service_started

  # Create Mission Planner Service
  mission-planner-service:
    build:
      context: ..
      dockerfile: packages/services/mission_planner/Dockerfile
    image: ${MISSION_PLANNER_SERVICE_IMAGE:-mission_planner_service:latest}
    command: ["python", "-m", "packages.services.mission_planner.main",
              "--port", "${MISSION_PLANNER_PORT:-8005}",
              "--host", "0.0.0.0"]
    environment:
      - ARANGO_HOST=localhost
      - ARANGO_PORT=${ARANGO_PORT:-8529}
      - ARANGO_USERNAME=root
      - ARANGO_PASSWORD=${ARANGO_ROOT_PASSWORD:-openSesame}
      - DATABASE_NAME=${GRAPH_DB_NAME:-topomap_db}
      - MINIO_HOST=localhost
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=false
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE_PORT=${POSTGRES_DATABASE_PORT}
      - POSTGRES_DATABASE_NAME=${POSTGRES_DATABASE_NAME}
      - POSTGRES_DATABASE_USERNAME=${POSTGRES_DATABASE_USERNAME}
      - POSTGRES_DATABASE_PASSWORD=${POSTGRES_DATABASE_PASSWORD}
      - DEFAULT_MAP_ID=${IMAGE_DB_DEFAULT_MAP:-default}
      - KNN_K=${MISSION_PLANNER_KNN_K:-1}
      - RANGE_SEARCH_RADIUS=${MISSION_PLANNER_RANGE_SEARCH_RADIUS:-2.0}
      - MQTT_ENABLED=${MQTT_ENABLED:-true}
      - MQTT_BROKER=${MQTT_BROKER:-localhost}
      - MQTT_PORT=${MQTT_PORT_TCP:-1883}
      - MQTT_KEEPALIVE=${MQTT_KEEPALIVE:-60}
    network_mode: "host"
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
      arangodb:
        condition: service_started

  # Create LiveKit Service
  livekit-service:
    build:
      context: ..
      dockerfile: packages/services/livekit/Dockerfile
    image: ${LIVEKIT_SERVICE_IMAGE:-livekit_service:latest}
    command: ["python", "-m", "packages.services.livekit.main",
              "--port", "${LIVEKIT_PORT:-8006}",
              "--host", "0.0.0.0"]
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_SERVER_URL=${LIVEKIT_SERVER_URL}
      - LIVEKIT_TTL=${LIVEKIT_TTL:-36000}
      - ARANGO_PASSWORD=${ARANGO_ROOT_PASSWORD:-openSesame}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    network_mode: "host"
    restart: unless-stopped


  # Self-hosted LiveKit SFU (Tailscale-only): live robot video for the dashboard.
  # Independent of livekit-service above (LiveKit Cloud tokens); its token
  # counterpart is livekit-sfu-tokens below. Design and ops:
  # docs/livekit_sfu/. Host networking: the SFU needs the wide UDP port range
  # and must see the tailscale0 interface; exposure is limited by the host
  # firewall and the Tailscale ACL, not by binding.
  # NOTE: `restart_services.sh` stops and starts this with everything else, so
  # live video drops for a few seconds and clients reconnect.
  livekit-sfu:
    image: livekit/livekit-server:v1.9.1   # pinned to the version validated in docs/livekit_sfu/TESTING.md
    # Fixed name: tests/performance/livekit/*.sh select this exact container.
    container_name: sati_livekit_sfu
    # LiveKit reads its key pair from LIVEKIT_KEYS ("key: secret"); build it from
    # the same env file the token service reads, so the pair lives in one place.
    # $$ escapes compose interpolation -- the shell in the container expands these.
    entrypoint:
      - sh
      - -c
      - |
        [ -n "$${LIVEKIT_SFU_API_KEY}" ] && [ -n "$${LIVEKIT_SFU_API_SECRET}" ] || {
          echo "LIVEKIT_SFU_API_KEY/SECRET not set: create docker_compose/livekit_sfu.env from livekit_sfu.env.example" >&2
          exit 1
        }
        LIVEKIT_KEYS="$${LIVEKIT_SFU_API_KEY}: $${LIVEKIT_SFU_API_SECRET}" exec /livekit-server --config /etc/livekit.yaml
    # Gitignored (holds the key pair). Optional here so a checkout without it can
    # still build/start/stop every other service; these two then exit with the
    # message above / the token service's own missing-variable error.
    env_file:
      - path: livekit_sfu.env
        required: false
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    network_mode: "host"
    restart: unless-stopped

  # Role-scoped token service for the SFU above (robots: publish; operators, i.e.
  # the sati-client dashboard: subscribe + data). Tailnet-only, no auth of its own;
  # sati-client's gateway nginx only exposes /api/operator/createToken.
  livekit-sfu-tokens:
    build:
      context: ..
      dockerfile: packages/services/livekit_sfu_tokens/Dockerfile
    image: ${LIVEKIT_SFU_TOKENS_IMAGE:-livekit_sfu_tokens:latest}
    command: ["python", "-m", "packages.services.livekit_sfu_tokens.main",
              "--port", "${LIVEKIT_SFU_TOKENS_PORT:-8008}",
              "--host", "0.0.0.0"]
    env_file:
      - path: livekit_sfu.env
        required: false
    network_mode: "host"
    restart: unless-stopped

  # Create Agent Orchestrator Service (LLM triage of VDA5050 state)
  agent-orchestrator-service:
    build:
      context: ..
      dockerfile: packages/services/agent_orchestrator/Dockerfile
    image: ${AGENT_ORCHESTRATOR_SERVICE_IMAGE:-agent_orchestrator_service:latest}
    command: ["python", "-m", "packages.services.agent_orchestrator.main",
              "--port", "${AGENT_ORCHESTRATOR_PORT:-8007}",
              "--host", "0.0.0.0"]
    environment:
      - MQTT_HOST=localhost
      - MQTT_PORT=${MQTT_PORT_TCP:-1883}
      - MQTT_VDA5050_PREFIX=${MQTT_VDA5050_PREFIX:-uagv/v2/RobotCompany}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Optional: point the Anthropic client at a local LiteLLM proxy (Gemini etc.)
      # for free dev LLM. See docker_compose/llm_proxy.yaml. Unset == real API.
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - AGENT_MODEL=${AGENT_MODEL:-claude-haiku-4-5}
      - AGENT_BATTERY_LOW_THRESHOLD=${AGENT_BATTERY_LOW_THRESHOLD:-20.0}
      # Required by packages/config.py at import time:
      - ARANGO_PASSWORD=${ARANGO_ROOT_PASSWORD:-openSesame}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    network_mode: "host"
    restart: unless-stopped
    depends_on:
      - mosquitto


  # Create API Delegation Service
  api-delegation-service:
    build:
      context: ..
      dockerfile: packages/api/Dockerfile
    image: ${API_DELEGATION_SERVICE_IMAGE:-api_delegation_service:latest}
    command: ["python", "-m", "packages.api.main",
              "--port", "${API_DELEGATION_PORT:-8000}",
              "--host", "0.0.0.0"]
    environment:
      - ARANGO_HOST=localhost
      - ARANGO_PORT=${ARANGO_PORT:-8529}
      - ARANGO_USERNAME=root
      - ARANGO_PASSWORD=${ARANGO_ROOT_PASSWORD:-openSesame}
      - DATABASE_NAME=${GRAPH_DB_NAME:-topomap_db}
      - MINIO_HOST=${MINIO_HOST:-localhost}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MINIO_SECURE=false
      - MISSION_PLANNER_URL=http://localhost:${MISSION_PLANNER_PORT:-8005}
      - LIVEKIT_URL=http://localhost:${LIVEKIT_PORT:-8006}
      - POSTGRES_DATABASE_PORT=${POSTGRES_DATABASE_PORT}
      - POSTGRES_DATABASE_NAME=${POSTGRES_DATABASE_NAME}
      - POSTGRES_DATABASE_USERNAME=${POSTGRES_DATABASE_USERNAME}
      - POSTGRES_DATABASE_PASSWORD=${POSTGRES_DATABASE_PASSWORD}
      - DEFAULT_MAP_ID=${IMAGE_DB_DEFAULT_MAP:-default}
      - ROSBAG_PRESIGN_EXPIRY=${ROSBAG_PRESIGN_EXPIRY:-3600}
      - GRAPH_BUILDER_WS_URL=ws://localhost:${GRAPH_BUILDER_PORT:-8004}
      - MISSION_DISPATCHER_WS_URL=ws://localhost:${DATABASE_API_PORT:-5000}
      # 3D reconstruction gateway (docs/reconstruction/design.md §6.9, §13). The service itself
      # is deployed from its own repo. Empty URL/key/secret = feature off (POST -> 503).
      - RECONSTRUCTION_SERVICE_URL=${RECONSTRUCTION_SERVICE_URL:-}
      - RECONSTRUCTION_SERVICE_KEY=${RECONSTRUCTION_SERVICE_KEY:-}
      - RECONSTRUCTION_CALLBACK_SECRET=${RECONSTRUCTION_CALLBACK_SECRET:-}
      - RECONSTRUCTION_CALLBACK_BASE_URL=${RECONSTRUCTION_CALLBACK_BASE_URL:-http://localhost:8000}
      - RECONSTRUCTION_MINIO_ENDPOINT=${RECONSTRUCTION_MINIO_ENDPOINT:-localhost:9000}
    # Optional: the SFU key pair lets DELETE /api/v1/robots/{name} remove the robot's LiveKit participant.
    env_file:
      - path: livekit_sfu.env
        required: false
    network_mode: "host"
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
      arangodb:
        condition: service_started
      minio:
        condition: service_started
      mission-planner-service:
        condition: service_started
      livekit-service:
        condition: service_started
      graph-builder-service:
        condition: service_started

volumes:
  arango_data:
  mission_dispatch_spill:
  pgdata14:
    # Production PG14 data. This was the container's anonymous volume, pinned by name so that
    # `down`/`up` reattaches it instead of creating a fresh, empty one. external: compose never
    # creates or deletes it, not even with `down -v`.
    external: true
    name: b323568ff9d35df1ea2dfd6916624635ca53953379106159029ca3dd0830fa52
  pgdata17:
    # Production PG17 + TimescaleDB data (cutover 2026-09-24). pgdata14 above is kept
    # for rollback and 2-week retention (runbook §7-§8).
    external: true
    name: sati_pgdata17
