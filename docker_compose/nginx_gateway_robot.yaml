# Robot (Raspberry Pi) gateway: the same public paths as the cloud, one door for the app. Layered next to the robot
# stack (mission_dispatch_services_robot.yaml); needs ROBOT_TAILNET_IP from .env.robot.
#
#   docker compose --env-file .env.robot -f nginx_gateway_robot.yaml up -d
#
# Not started by deploy_robot.sh yet. Listens on loopback + the tailnet IP only (docs/robot_deploy.md).
# Its own compose project: deploy_robot.sh runs `up -d --remove-orphans` for the robot stack, which would otherwise delete
# this container (same directory = same default project name).
name: sati-robot-gateway

services:
  nginx-gateway:
    image: nginx:alpine
    container_name: sati_nginx_gateway
    network_mode: "host"
    environment:
      - ROBOT_TAILNET_IP=${ROBOT_TAILNET_IP:?set ROBOT_TAILNET_IP}
      - ROBOT_GATEWAY_PORT=${ROBOT_GATEWAY_PORT:-80}
    volumes:
      - ./nginx/nginx-robot.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx:/etc/nginx/sati:ro      # routes.conf, web-routes.conf (cloud) and the CORS files are included from here
      - nginx_logs:/var/log/nginx
    mem_limit: 64m
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:${ROBOT_GATEWAY_PORT:-80}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  nginx_logs:
