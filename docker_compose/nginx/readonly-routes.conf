# Read-only API door (port 8090) for offline analysis tools, e.g. the navstack bag-analysis agents
# (sati_ros_navstack behaviour/reference/AGENT_TEAM_DESIGN_2026_10_29.md, section 8.1). Included inside a `server { }`
# by readonly-cloud.conf.template (cloud) and nginx-robot.conf.template (robot); needs the upstreams backend_api (:8000)
# and diagnostics_api (:8011) from the including file.
#
# Only GET (and so HEAD) passes; any other method answers 403. The robot-control proxy and data transfer are closed
# even for GET. This door is only read-only if the callers cannot reach :8000 directly: the agents' sandbox allows
# this port and nothing else on the server.

    access_log /var/log/nginx/sati_readonly_access.log;
    error_log /var/log/nginx/sati_error.log;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://backend_api/health;
    }

    location /api/v1/orchestration/ { return 403; }
    location /api/v1/transfer/ { return 403; }

    location /api/v1/ {
        limit_except GET { deny all; }
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    location /api/diagnostics/ {
        limit_except GET { deny all; }
        proxy_pass http://diagnostics_api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / { return 404; }
