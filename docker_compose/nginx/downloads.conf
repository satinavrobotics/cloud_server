# The desktop app's installers and its release manifest, served from ./downloads (mounted at /srv/sati-downloads).
# Included inside `server { }` by the cloud configs only: a robot gateway serves no downloads.
#   /downloads/latest.json   the manifest (never cached: it is how an app learns about a new version)
#   /downloads/<file>        installers, named by version (immutable, cacheable), sent as attachments
# No directory listing; only what the release script put there is reachable.

location = /downloads/latest.json {
    alias /srv/sati-downloads/latest.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /downloads/ {
    alias /srv/sati-downloads/;
    autoindex off;
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
}
