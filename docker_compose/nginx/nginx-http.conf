# Nginx Reverse Proxy Configuration (HTTP only - for testing)
# Single entry point for all Sati services

# gzip (http context): occupancy API JSON and chunk bodies (occupancy_view_proposal.md L-4)
gzip on;
gzip_types application/json application/octet-stream;
gzip_min_length 1024;
gzip_vary on;

# Upstream definitions
upstream backend_api {
    server localhost:8000;
}

upstream web_server {
    server localhost:8081;
}

# Agent Orchestrator — single cloud service (not per-robot); proxy straight to :8007
upstream agent_api {
    server localhost:8007;
}

# Self-hosted LiveKit token service (cloud_server's livekit-sfu-tokens service, :8008). Only used when the client runs with
# EXPO_PUBLIC_LIVEKIT_BACKEND=selfhost.
upstream livekit_selfhost_api {
    server localhost:8008;
}

# HTTP server
server {
    listen 80;
    server_name mlflow.satinavrobotics.com _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/sati_access.log;
    error_log /var/log/nginx/sati_error.log;

    # Routing shared with the HTTPS and robot gateways
    include /etc/nginx/sati/routes.conf;

    # Expo hot reload endpoints - proxy to web server (port 8081)
    location /hot {
        proxy_pass http://web_server;
        proxy_http_version 1.1;

        # WebSocket specific headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Expo message endpoint - proxy to web server (port 8081)
    location /message {
        proxy_pass http://web_server;
        proxy_http_version 1.1;

        # WebSocket specific headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Root - proxy to web server (port 8081)
    location / {
        proxy_pass http://web_server;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
