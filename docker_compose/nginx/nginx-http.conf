# Nginx Reverse Proxy Configuration (HTTP only - for testing)
# Single entry point for all Sati services

# gzip (http context): occupancy API JSON and chunk bodies (occupancy_view_proposal.md L-4)
gzip on;
gzip_types application/json application/octet-stream;
gzip_min_length 1024;
gzip_vary on;

# CORS values used by routes.conf
include /etc/nginx/sati/cors-cloud.conf;

# Upstream definitions
upstream backend_api {
    server 127.0.0.1:8000;
}

upstream web_server {
    server 127.0.0.1:8081;
}

# Agent Orchestrator — single cloud service (not per-robot); proxy straight to :8007
upstream agent_api {
    server 127.0.0.1:8007;
}

# Self-hosted LiveKit token service (cloud_server's livekit-sfu-tokens service, :8008). Only used when the client runs with
# EXPO_PUBLIC_LIVEKIT_BACKEND=selfhost.
# Server diagnostics (container status and logs), loopback only.
upstream diagnostics_api {
    server 127.0.0.1:8011;
}

upstream livekit_selfhost_api {
    server 127.0.0.1:8008;
}

# HTTP server
server {
    listen 80;
    server_name mlflow.satinavrobotics.com _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/sati_access.log;
    error_log /var/log/nginx/sati_error.log;
    error_log /dev/stderr warn;     # also in `docker logs`, so server diagnostics can read it

    # Routing shared with the HTTPS and robot gateways
    include /etc/nginx/sati/routes.conf;

    # The web app and the Expo dev server (shared with the HTTPS config)
    include /etc/nginx/sati/web-routes.conf;

    # Desktop app installers and release manifest (cloud only)
    include /etc/nginx/sati/downloads.conf;
}
