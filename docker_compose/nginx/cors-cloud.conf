# CORS for the cloud gateway: as before, any origin may call /api/ and the orchestration and agent routes echo theirs.
# (Included at http level by nginx-http.conf / nginx.conf; the variables are used by routes.conf.)
map $uri $cors_origin_any   { default "*"; }
map $uri $cors_origin_echo  { default $http_origin; }
map $uri $cors_credentials  { default "true"; }
