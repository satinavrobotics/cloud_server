# Nginx Reverse Proxy Configuration
# Single entry point for all Sati services

# Upstream definitions
upstream backend_api {
    server localhost:8000;
}

upstream web_server {
    server localhost:8081;
}

# Agent Orchestrator — single cloud service (not per-robot); proxy straight to :8007
upstream agent_api {
    server localhost:8007;
}

# Self-hosted LiveKit token service (cloud_server's livekit-sfu-tokens service, :8008). Only used when the client runs with
# EXPO_PUBLIC_LIVEKIT_BACKEND=selfhost.
upstream livekit_selfhost_api {
    server localhost:8008;
}

# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name mlflow.satinavrobotics.com;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name mlflow.satinavrobotics.com;

    # SSL configuration (update paths to your certificates)
    ssl_certificate /etc/letsencrypt/live/mlflow.satinavrobotics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mlflow.satinavrobotics.com/privkey.pem;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/sati_access.log;
    error_log /var/log/nginx/sati_error.log;

    # Routing shared with the HTTP and robot gateways
    include /etc/nginx/sati/routes.conf;

    # Expo hot reload endpoints - proxy to web server (port 8081)
    location /hot {
        proxy_pass http://web_server;
        proxy_http_version 1.1;

        # WebSocket specific headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Expo message endpoint - proxy to web server (port 8081)
    location /message {
        proxy_pass http://web_server;
        proxy_http_version 1.1;

        # WebSocket specific headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Root - proxy to web server (port 8081)
    location / {
        proxy_pass http://web_server;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
