# CORS for the robot gateway: none. The desktop app reaches the robot through its own same-origin relay, so a web page
# in an operator's browser has no business calling the robot cross-origin: without an Access-Control-Allow-Origin header
# a browser refuses it (including the preflight answered with 204). Empty values make nginx omit the headers.
map $uri $cors_origin_any   { default ""; }
map $uri $cors_origin_echo  { default ""; }
map $uri $cors_credentials  { default ""; }
