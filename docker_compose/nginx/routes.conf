# Shared routing for every Sati gateway (cloud HTTP, cloud HTTPS, robot): one source of truth.
# Included inside a `server { }` by docker_compose/nginx/*.conf; mounted at /etc/nginx/sati/routes.conf.
# CORS: the Access-Control-Allow-Origin / -Credentials values are variables defined per gateway (cors-cloud.conf,
# cors-robot.conf); an empty value makes nginx omit the header, so a gateway without CORS answers no origin.
# Needs these upstreams defined by the including file: backend_api (:8000), agent_api (:8007),
# livekit_selfhost_api (:8008), diagnostics_api (:8011). A service that is not running just answers 502 for its prefix:
# GET /api/v1/server-info says which ones are really there.

    # Orchestration API - proxies to cloud_server which forwards to the robot orchestrator
    location /api/orchestration/ {
        proxy_pass http://backend_api/api/v1/orchestration/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        add_header Access-Control-Allow-Origin $cors_origin_echo always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials $cors_credentials always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Agent Orchestrator API - proxies directly to the agent service (port 8007).
    # Single cloud singleton: the robot name is a path segment within the service,
    # e.g. /api/agent/insights/robot1 -> :8007/insights/robot1, /api/agent/stats -> :8007/stats.
    location /api/agent/ {
        proxy_pass http://agent_api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        add_header Access-Control-Allow-Origin $cors_origin_echo always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials $cors_credentials always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Server diagnostics: container status, logs and what looks wrong (read-only), /api/diagnostics/services...
    # No CORS headers on purpose: the logs are for the app (same origin, or the desktop app's relay), never for another web page.
    location /api/diagnostics/ {
        proxy_pass http://diagnostics_api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Self-hosted LiveKit tokens - /api/livekit-selfhost/createToken ->
    # :8008/api/operator/createToken. That service route can only mint operator
    # (subscribe + data) tokens, so it is safe on the public path: the tokens are
    # useless off the tailnet and the LAN (the SFU is not public). No source-IP allow list:
    # the dev reverse tunnel arrives here as 127.0.0.1, so it could never pass one.
    # Robot tokens (/api/createToken on :8008) are deliberately not routed here.
    location /api/livekit-selfhost/ {
        proxy_pass http://livekit_selfhost_api/api/operator/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Mapping-session start / finish / pause / resume. A finish (and a start with `replace`) of a
    # SLAM map keeps the request open until the robot has saved the SLAM map (~150 s, cloud_server
    # packages/api/maps.py _save_slam wait=True); with the 60 s of /api/ nginx answered 504 while
    # the server went on and succeeded. A regex location wins over the /api/ prefix; only these
    # endpoints get the long timeout, everything else keeps 60 s.
    location ~ ^/api/v1/maps/[^/]+/sessions(/[^/]+/(pause|resume|finish))?$ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (2400 s: Finish waits up to 1800 s (FINISH_BACKLOG_MAX_S hard ceiling) for the robot's upload backlog, then the topomap stop up to 75 s and the SLAM save ~150 s)
        proxy_connect_timeout 60s;
        proxy_send_timeout 2400s;
        proxy_read_timeout 2400s;

        # CORS headers (as /api/)
        add_header Access-Control-Allow-Origin $cors_origin_any always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Reconstruction files (cloud.ply is tens to hundreds of MB, `?max_points=N` builds a decimated
    # copy on its first request and sends nothing until it is done). Like the trajectory pack: no
    # buffering (nginx would spool a big cloud to disk before/while sending), NO gzip (a binary
    # float cloud gains little, costs a Pi its CPU and the compressed answer has no Content-Length,
    # which the client's progress needs), and a long read timeout for the build. Regex beats /api/.
    location ~ ^/api/v1/maps/[^/]+/reconstruction/files/[^/]+$ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        gzip off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        add_header Access-Control-Allow-Origin $cors_origin_any always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, If-None-Match" always;
        add_header Access-Control-Expose-Headers "X-Total-Points, X-Returned-Points, ETag" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Session trajectory pack (a tar of a whole mapping session's images, depth and costmaps,
    # cloud_server packages/api/session_trajectory.py). Streamed: buffering off so nginx neither
    # spools gigabytes to disk nor holds the first byte, and a read timeout of 600 s between two
    # chunks (the API sends one at least every few seconds). A regex location wins over /api/.
    location ~ ^/api/v1/maps/[^/]+/sessions/[^/]+/trajectory$ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        add_header Access-Control-Allow-Origin $cors_origin_any always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Data transfer (packages/api/data_transfer.py): a bundle is uploaded or downloaded whole and can be many GB, so no
    # body size limit, no buffering to disk, and long timeouts (a pull waits for the other server's export).
    location /api/v1/transfer/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 0;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        add_header Access-Control-Allow-Origin $cors_origin_any always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # API endpoints - proxy to backend API (port 8000)
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # CORS headers
        add_header Access-Control-Allow-Origin $cors_origin_any always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, If-None-Match" always;
        # What a page on another origin (the phone app's map view) needs to read: the conditional-request tag, the retry hint of a
        # 503, the scene graph's epoch (409) and version, the raster's shape / origin / step / type, and the point counts.
        add_header Access-Control-Expose-Headers "ETag, Retry-After, X-Scene-Graph-Epoch, X-Scene-Graph-Version, X-Raster-Shape, X-Raster-Origin, X-Raster-Step, X-Raster-Dtype, X-Total-Points, X-Returned-Points" always;
        
        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Agent Orchestrator WebSocket - proxy directly to the agent service (port 8007).
    # e.g. /ws/agent/insights/robot1 -> :8007/ws/insights/robot1
    location /ws/agent/ {
        proxy_pass http://agent_api/ws/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # WebSocket endpoints - proxy to backend API (port 8000)
    location /ws/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        # WebSocket specific headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://backend_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
