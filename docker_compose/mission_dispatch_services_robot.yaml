# Robot (Raspberry Pi 4, linux/arm64) override: the same stack as the cloud, smaller, pulled from the private registry.
# No sync or share with the cloud. Layered over the main file, which stays the single definition of every service:
#
#   docker compose --env-file .env.robot \
#     -f mission_dispatch_services.yaml -f mission_dispatch_services_robot.yaml up -d --no-build
#
# (scripts/deploy_robot.sh wraps this.) Needs Docker Compose >= 2.24 (`!override`, `!reset`).
#
# What differs from the cloud:
#   - off (profile cloud-only, never started here): livekit-service (LiveKit Cloud tokens: needs the internet),
#     agent-orchestrator-service (needs an LLM API).
#   - kept: mosquitto, postgres, arangodb, minio, minio-tailnet, mission-dispatch, graph-builder, mission-planner, api,
#     nginx-gateway, livekit-sfu + livekit-sfu-tokens (the robot's own video server, small config, no internet needed).
#     minio-tailnet stays: presigned URLs are signed for MINIO_HOST, which here is the Pi's tailnet IP.
#   - images come from the registry (IMAGE_REGISTRY/IMAGE_TAG, written by scripts/build_push.sh), never built here.
#   - Python services get MALLOC_ARENA_MAX=2 (glibc makes up to 8 arenas per core for many threads; fewer arenas, lower RSS).
#   - Every container has a memory limit (defaults sum to 3456 MiB = ~3.4 GiB, ~4.1 GiB with the reconstruction container, set from
#     what each one used on a 4 GB Pi: the graph builder alone peaked at ~750 MB; see .env.robot.example for 8 GB) and a
#     rotated log. Postgres, ArangoDB, the planner and graph-builder listen on loopback only; mosquitto on loopback + the
#     tailnet IP; the API (8000) and MinIO's tailnet forwarder are the only other doors.
#   - MinIO data lives under ${MINIO_DATA_DIR}; the cloud's hash-named pgdata14 volume does not exist here.
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  mosquitto:
    command:
      - /bin/sh
      - -c
      - |
        sh mosquitto.sh "${MQTT_PORT_TCP}" "${MQTT_PORT_WEBSOCKET}" "127.0.0.1 ${ROBOT_TAILNET_IP:?set ROBOT_TAILNET_IP}" "error warning notice"
    mem_limit: ${MEM_MOSQUITTO:-64m}
    logging: *logging

  postgres:
    # timescaledb-tune runs once, at initdb (an existing data volume keeps its settings).
    environment:
      - TS_TUNE_MEMORY=${PG_TUNE_MEMORY:-512MB}
      - TS_TUNE_NUM_CPUS=${PG_TUNE_CPUS:-2}
      - TS_TUNE_MAX_CONNS=${PG_MAX_CONNS:-60}
    command: !override
      - postgres
      - -c
      - timescaledb.telemetry_level=off
      - -c
      - timezone=UTC
      - -c
      - listen_addresses=127.0.0.1
    mem_limit: ${MEM_POSTGRES:-448m}
    logging: *logging
    # First boot (initdb, timescaledb-tune, extensions) is slow on a Pi.
    healthcheck:
      start_period: 120s
      retries: 30

  arangodb:
    # RocksDB caches and AQL memory capped to fit the Pi; the entrypoint passes option-style args to arangod.
    command:
      - --server.endpoint=tcp://127.0.0.1:${ARANGO_PORT:-8529}
      - --rocksdb.block-cache-size=${ARANGO_BLOCK_CACHE_BYTES:-100000000}
      - --rocksdb.total-write-buffer-size=${ARANGO_WRITE_BUFFER_BYTES:-100000000}
      - --query.memory-limit=${ARANGO_QUERY_MEMORY_BYTES:-200000000}
    mem_limit: ${MEM_ARANGO:-512m}
    logging: *logging
    healthcheck:
      start_period: 90s

  minio:
    # Built from source by scripts/build_push.sh (docker/minio): the upstream image is no longer published.
    image: ${IMAGE_REGISTRY:-100.85.3.47:5050/sati}/minio:${IMAGE_TAG:-latest}
    volumes: !override
      - ${MINIO_DATA_DIR:?set MINIO_DATA_DIR}:/data
    mem_limit: ${MEM_MINIO:-384m}
    logging: *logging

  minio-tailnet:
    environment:
      - MINIO_TAILNET_IP=${ROBOT_TAILNET_IP:?set ROBOT_TAILNET_IP}
    mem_limit: 64m
    logging: *logging

  mission-dispatch:
    build: !reset null
    image: ${IMAGE_REGISTRY:-100.85.3.47:5050/sati}/mission_dispatch:${IMAGE_TAG:-latest}
    environment:
      - MALLOC_ARENA_MAX=2
    mem_limit: ${MEM_DISPATCH:-160m}
    logging: *logging

  graph-builder-service:
    build: !reset null
    image: ${IMAGE_REGISTRY:-100.85.3.47:5050/sati}/graph_builder_service:${IMAGE_TAG:-latest}
    command: !override
      - python
      - -m
      - packages.services.graph_builder.main
      - --port
      - ${GRAPH_BUILDER_PORT:-8004}
      - --host
      - 127.0.0.1
    environment:
      # The default 256 MiB upload buffer would fill most of the container's limit.
      - UPLOAD_BUFFER_MAX_BYTES=${UPLOAD_BUFFER_MAX_BYTES:-100000000}
      # Scene-graph worker: cap the resident engines and the step pool to fit the container (the cloud defaults assume a big host).
      - SCENE_GRAPH_MAX_RESIDENT_BYTES=${SCENE_GRAPH_MAX_RESIDENT_BYTES:-120000000}
      - SCENE_GRAPH_WORKER_THREADS=${SCENE_GRAPH_WORKER_THREADS:-2}
      # Small steps: a fold used to run 60-85 s (budget off, 48 leaves), which stalled the worker and held many decoded PNGs
      # in memory. Stop reading nodes after 5 s, fold 8 leaves at a time and prefetch at most 16 PNGs.
      - SCENE_GRAPH_STEP_BUDGET_S=${SCENE_GRAPH_STEP_BUDGET_S:-5}
      - SCENE_GRAPH_BATCH_MAX_LEAVES=${SCENE_GRAPH_BATCH_MAX_LEAVES:-8}
      - SCENE_GRAPH_PREFETCH_QUEUE=${SCENE_GRAPH_PREFETCH_QUEUE:-16}
      - MALLOC_ARENA_MAX=2
    mem_limit: ${MEM_GRAPH_BUILDER:-896m}
    logging: *logging

  mission-planner-service:
    build: !reset null
    image: ${IMAGE_REGISTRY:-100.85.3.47:5050/sati}/mission_planner_service:${IMAGE_TAG:-latest}
    command: !override
      - python
      - -m
      - packages.services.mission_planner.main
      - --port
      - ${MISSION_PLANNER_PORT:-8005}
      - --host
      - 127.0.0.1
    environment:
      # Scene-graph planner: fewer cached graphs, with a byte budget, to fit the container.
      - SCENE_GRAPH_CACHE_VERSIONS=${SCENE_GRAPH_CACHE_VERSIONS:-2}
      - SCENE_GRAPH_CACHE_MAX_BYTES=${SCENE_GRAPH_CACHE_MAX_BYTES:-80000000}
      # Byte caches of the planner (cloud defaults 64 MB store tiles; the lazy tile cache is a count of ~35 KB tiles).
      - SCENE_GRAPH_STORE_TILE_CACHE_BYTES=${SCENE_GRAPH_STORE_TILE_CACHE_BYTES:-33554432}
      - SCENE_GRAPH_LAZY_TILE_CACHE=${SCENE_GRAPH_LAZY_TILE_CACHE:-512}
      - MALLOC_ARENA_MAX=2
    mem_limit: ${MEM_PLANNER:-192m}
    logging: *logging

  api-delegation-service:
    build: !reset null
    image: ${IMAGE_REGISTRY:-100.85.3.47:5050/sati}/api_delegation_service:${IMAGE_TAG:-latest}
    environment:
      # Presigned URLs are signed for the Pi's tailnet address (served by minio-tailnet).
      - MINIO_HOST=${ROBOT_TAILNET_IP:?set ROBOT_TAILNET_IP}
      - RECONSTRUCTION_MINIO_ENDPOINT=${ROBOT_TAILNET_IP}:${MINIO_PORT:-9000}
      # Removes a deleted robot's participant from the local SFU (loopback, LIVEKIT_SFU_ADMIN_URL's default).
      - LIVEKIT_SFU_API_KEY=${LIVEKIT_SFU_API_KEY:?set LIVEKIT_SFU_API_KEY}
      - LIVEKIT_SFU_API_SECRET=${LIVEKIT_SFU_API_SECRET:?set LIVEKIT_SFU_API_SECRET}
      # Byte caches (cloud defaults: 96 MB results, 64 MB occupancy chunks, 64 MB occupancy index, 64 MB per store's tiles).
      - SCENE_GRAPH_API_RESULT_CACHE_BYTES=${SCENE_GRAPH_API_RESULT_CACHE_BYTES:-25165824}
      - OCCUPANCY_CHUNK_CACHE_BYTES=${OCCUPANCY_CHUNK_CACHE_BYTES:-16777216}
      - OCCUPANCY_INDEX_CACHE_BYTES=${OCCUPANCY_INDEX_CACHE_BYTES:-8388608}
      - SCENE_GRAPH_STORE_TILE_CACHE_BYTES=${SCENE_GRAPH_STORE_TILE_CACHE_BYTES:-16777216}
      - MALLOC_ARENA_MAX=2
    mem_limit: ${MEM_API:-384m}
    logging: *logging
    # The entrypoint runs `alembic upgrade head` before serving; mission-dispatch waits for this to be healthy.
    healthcheck:
      start_period: 120s
    # livekit-service is not started on the robot, so the API must not wait for it.
    depends_on: !override
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
      arangodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      mission-planner-service:
        condition: service_started
      graph-builder-service:
        condition: service_started

  # The app's one door: forwards /api/ and /ws/ to the API by path (docs/robot_deploy.md, Gateway). Loopback + the tailnet
  # IP only (plus ROBOT_LAN_IP when set), no CORS headers. Stock image, nothing to build.
  nginx-gateway:
    image: nginx:alpine
    container_name: sati_nginx_gateway
    network_mode: host
    environment:
      - ROBOT_TAILNET_IP=${ROBOT_TAILNET_IP:?set ROBOT_TAILNET_IP}
      - ROBOT_GATEWAY_PORT=${ROBOT_GATEWAY_PORT:-80}
      - ROBOT_LAN_IP=${ROBOT_LAN_IP:-127.0.0.2}       # off unless set: a LAN door is an explicit choice (no login on the gateway)
    volumes:
      - ./nginx/nginx-robot.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx:/etc/nginx/sati:ro      # routes.conf and the CORS files are included from here
      - nginx_logs:/var/log/nginx
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:${ROBOT_GATEWAY_PORT:-80}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      api-delegation-service:
        condition: service_healthy

  # Self-hosted video, offline: the Jetson robots publish to this SFU and clients subscribe (docs/robot_deploy.md, Video).
  # Reached on the tailnet IP only (7880 signalling, 7881 TCP, 50000-50100 UDP media). Keys: LIVEKIT_SFU_API_KEY/SECRET.
  livekit-sfu:
    image: ${IMAGE_REGISTRY:-100.85.3.47:5050/sati}/livekit_sfu:${IMAGE_TAG:-latest}
    environment:
      - LIVEKIT_SFU_API_KEY=${LIVEKIT_SFU_API_KEY:?set LIVEKIT_SFU_API_KEY}
      - LIVEKIT_SFU_API_SECRET=${LIVEKIT_SFU_API_SECRET:?set LIVEKIT_SFU_API_SECRET}
      - ROBOT_TAILNET_IP=${ROBOT_TAILNET_IP:?set ROBOT_TAILNET_IP}
    volumes: !override
      - ./livekit/livekit-robot.yaml:/etc/livekit-robot.yaml:ro
    entrypoint: !override
      - sh
      - -c
      - |
        sed "s/__NODE_IP__/$${ROBOT_TAILNET_IP}/g" /etc/livekit-robot.yaml > /tmp/livekit.yaml
        LIVEKIT_KEYS="$${LIVEKIT_SFU_API_KEY}: $${LIVEKIT_SFU_API_SECRET}" exec /livekit-server --config /tmp/livekit.yaml
    mem_limit: ${MEM_LIVEKIT:-128m}
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:7880/"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  # Role-scoped tokens for the SFU. Robots call /api/createToken on the tailnet IP; the gateway forwards the operator route.
  livekit-sfu-tokens:
    build: !reset null
    image: ${IMAGE_REGISTRY:-100.85.3.47:5050/sati}/livekit_sfu_tokens:${IMAGE_TAG:-latest}
    command: !override
      - python
      - -m
      - packages.services.livekit_sfu_tokens.main
      - --port
      - ${LIVEKIT_SFU_TOKENS_PORT:-8008}
      - --host
      - ${ROBOT_TAILNET_IP:?set ROBOT_TAILNET_IP}
    environment:
      - LIVEKIT_SFU_API_KEY=${LIVEKIT_SFU_API_KEY:?set LIVEKIT_SFU_API_KEY}
      - LIVEKIT_SFU_API_SECRET=${LIVEKIT_SFU_API_SECRET:?set LIVEKIT_SFU_API_SECRET}
      # What robots and clients are told to connect to: this Pi's SFU.
      - LIVEKIT_SFU_SERVER_URL=${LIVEKIT_SFU_SERVER_URL:-ws://${ROBOT_TAILNET_IP}:7880}
    mem_limit: 64m
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://${ROBOT_TAILNET_IP}:${LIVEKIT_SFU_TOKENS_PORT:-8008}/health', timeout=4); sys.exit(0)"]

  # Container status and logs for the dashboard (docs: server diagnostics). Loopback only, behind the gateway.
  # Needs its image pushed first (scripts/build_push.sh), then SERVER_DIAGNOSTICS_AVAILABLE=true and COMPOSE_PROFILES=diagnostics in .env.robot.
  server-diagnostics:
    profiles: [diagnostics]      # COMPOSE_PROFILES=diagnostics in .env.robot; a tag that predates the image (rollback) still deploys without it
    build: !reset null
    image: ${IMAGE_REGISTRY:-100.85.3.47:5050/sati}/server_diagnostics:${IMAGE_TAG:-latest}
    environment:
      - DIAGNOSTICS_GATEWAY_URL=http://127.0.0.1:${ROBOT_GATEWAY_PORT:-80}     # the checks ask the robot's own gateway
    mem_limit: 96m
    logging: *logging

  # --- not on the robot
  livekit-service:
    profiles: [cloud-only]
  agent-orchestrator-service:
    profiles: [cloud-only]

volumes:
  pgdata14: !reset null
  nginx_logs:
