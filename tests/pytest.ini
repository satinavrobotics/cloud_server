[pytest]
# Pytest configuration for cloud_server

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test paths
testpaths = tests

# Add dotenv support
env_files =
    .env

# Add project root to Python path
pythonpath = .

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Warnings
    -W ignore::DeprecationWarning
    # Coverage (commented out by default, enable when needed)
    # --cov=packages
    # --cov-report=html
    # --cov-report=term-missing
    # --cov-fail-under=80

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated, mocked dependencies)
    integration: Integration tests (medium speed, real dependencies)
    e2e: End-to-end tests (slow, full system)
    performance: Performance/load tests
    slow: Slow tests (> 10 seconds)
    requires_docker: Tests that require Docker
    requires_services: Tests that require running services

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (requires pytest-timeout)
# timeout = 300
# timeout_method = thread

# Parallel execution (requires pytest-xdist)
# -n auto will use all available CPU cores
# Uncomment to enable:
# addopts = -n auto

# Test order (requires pytest-randomly)
# Randomize test order to catch test interdependencies
# Uncomment to enable:
# addopts = --randomly-seed=1234

# Asyncio mode (requires pytest-asyncio)
asyncio_mode = auto

# Ignore paths
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    node_modules
    venv
    env

# Console output style
console_output_style = progress

# Doctest options
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

